name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_owner
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test_owner -d postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: development
      TEST_DATABASE_ADMIN_URL: postgresql+psycopg://test_owner:ci-only-password@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379/14
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.lock.txt
      - run: pip install -r requirements.lock.txt
      - run: python -m pytest -q -p no:cacheprovider --tb=short
      - name: Audit Python dependencies
        run: |
          python -m venv /tmp/lodge-audit
          /tmp/lodge-audit/bin/pip install pip-audit
          /tmp/lodge-audit/bin/pip-audit -r requirements.lock.txt
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Install browser checks
        working-directory: e2e
        run: npm ci
      - name: Install test browser
        working-directory: e2e
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Check account isolation in browser
        working-directory: e2e
        run: npm test
